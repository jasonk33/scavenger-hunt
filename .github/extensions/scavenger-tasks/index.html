<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scavenger hunt task board</title>
    <link rel="stylesheet" href="/ui.css" />
  </head>
  <body>
    <header class="bar">
      <div class="bar-top">
        <h1>Task board</h1>
        <div class="stats" id="stats"></div>
      </div>

      <div class="controls">
        <div class="seg" id="round-filter" role="group" aria-label="Round">
          <button class="on" data-round="all">All</button>
          <button data-round="1">R1</button>
          <button data-round="2">R2</button>
          <button data-round="0">Secret</button>
        </div>

        <div class="seg" id="status-filter" role="group" aria-label="Status">
          <button class="on" data-status="all">All</button>
          <button data-status="keep">Keep</button>
          <button data-status="maybe">Maybe</button>
          <button data-status="cut">Cut</button>
        </div>

        <select id="sort" aria-label="Sort by">
          <option value="doc">Doc order</option>
          <option value="score">Hardest first</option>
          <option value="mismatch">Tier disagreement</option>
          <option value="payoff">Weakest payoff first</option>
          <option value="risk">Riskiest first</option>
          <option value="luck">Luckiest first</option>
        </select>

        <input id="search" type="search" placeholder="Filter…" aria-label="Filter tasks" />

        <label class="check"><input type="checkbox" id="only-flagged" /> Flagged</label>
        <button id="toggle-balance" class="ghost">Balance</button>
      </div>

      <section id="publish" class="publish" data-kind="unknown">
        <div class="publish-line">
          <span class="publish-dot" aria-hidden="true"></span>
          <div class="publish-text">
            <b id="publish-headline">Checking what's live&hellip;</b>
            <span id="publish-detail"></span>
          </div>
          <button id="publish-recheck" class="ghost" title="Check again now">Recheck</button>
          <button id="publish-review" class="ghost primary" hidden>Review &amp; publish</button>
        </div>
        <div id="publish-preview" class="publish-preview" hidden>
          <p class="publish-warn">
            This writes to the live task list players are looking at right now. Submissions,
            media, scores and the roster are never touched.
          </p>
          <ul id="publish-changes"></ul>
          <div id="publish-warnings" class="publish-warnings" hidden></div>
          <div class="publish-actions">
            <button id="publish-confirm" class="ghost danger">Publish</button>
            <button id="publish-cancel" class="ghost">Cancel</button>
          </div>
        </div>
      </section>

      <section id="balance" class="balance" hidden></section>
    </header>

    <main id="list" class="list"></main>

    <template id="row-tpl">
      <article class="row">
        <div class="head">
          <button class="caret" aria-label="Expand"></button>
          <span class="tier"></span>
          <span class="arrow" hidden>&rarr;</span>
          <span class="tier suggested" hidden></span>
          <span class="title" role="textbox" contenteditable="plaintext-only" spellcheck="true"></span>
          <span class="chips"></span>
          <div class="seg status" role="group" aria-label="Status">
            <button data-status="keep">K</button>
            <button data-status="maybe">?</button>
            <button data-status="cut">X</button>
          </div>
        </div>
        <div class="body" hidden>
          <div class="sliders"></div>
          <div class="meta">
            <label class="field">
              <span>Points</span>
              <select class="points">
                <option value="1">1</option>
                <option value="3">3</option>
                <option value="5">5</option>
                <option value="7">7</option>
                <option value="10">10</option>
              </select>
            </label>
            <label class="field grow">
              <span>Prop needed</span>
              <input class="prop" type="text" placeholder="none" />
            </label>
            <label class="check"><input type="checkbox" class="clip" /> Video only</label>
            <label class="check"><input type="checkbox" class="rewrite" /> Needs rewrite</label>
          </div>
          <label class="field">
            <span>Note</span>
            <textarea class="note" rows="2" placeholder="Why it stays, why it goes, what's wrong with it…"></textarea>
          </label>
          <p class="doc-title" hidden></p>
        </div>
      </article>
    </template>

    <script type="module" src="/ui.js"></script>
  </body>
</html>
